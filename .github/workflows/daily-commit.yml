name: Realistic Scattered Daily Commits

on:
  schedule:
    - cron: '0 6,10,14,18 * * *'
  workflow_dispatch: 

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git Configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push commits with random probability
        run: |
          SHOULD_RUN=$(( RANDOM % 2 ))
          
          if [ $SHOULD_RUN -eq 0 ]; then
            echo "Coin flip landed on 0: Skipping this time slot."
            exit 0
          fi
          
          RANDOM_COMMITS=$(( (RANDOM % 3) + 1 ))
          echo "Coin flip landed on 1: Making $RANDOM_COMMITS commits."
          
          for i in $(seq 1 $RANDOM_COMMITS)
          do
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
            git commit --allow-empty -m "chore: routine repository sync - $TIMESTAMP - batch commit $i"
          done
          
          git push
